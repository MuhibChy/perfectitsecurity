[phases.setup]
# Install Composer and NPM dependencies
cmds = ["composer install --no-dev --prefer-dist --optimize-autoloader", "npm ci"]

[phases.build]
# Build production frontend assets
cmds = ["npm run build", "php artisan storage:link || true"]

[start]
# Bootstrap: migrate, (seed if empty), cache config/routes, start server
cmd = "chmod +x deploy.sh && bash deploy.sh"

[variables]
NIXPACKS_PHP_VERSION = "8.1"
APP_ENV = "production"
APP_DEBUG = "false"
LOG_CHANNEL = "stack"
LOG_LEVEL = "warning"
DB_CONNECTION = "sqlite"
DB_DATABASE = "/app/database/database.sqlite"
CACHE_DRIVER = "file"
QUEUE_CONNECTION = "sync"
SESSION_DRIVER = "file"
SESSION_LIFETIME = "120"
SESSION_SECURE_COOKIE = "true"
SESSION_SAME_SITE = "lax"
BROADCAST_DRIVER = "log"
FILESYSTEM_DISK = "local"
AI_AGENT_ENABLED = "false"
AI_CHAT_ENABLED = "false"
AI_PROVIDER = "ollama"
AI_FALLBACK_ENABLED = "false"
STRIPE_KEY = ""
STRIPE_SECRET = ""
STRIPE_WEBHOOK_SECRET = ""
MAIL_MAILER = "log"
BACKUP_ENABLED = "false"
