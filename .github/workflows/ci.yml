name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code Quality (PSR-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite
          coverage: none

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Check PSR-12 (Pint)
        run: vendor/bin/pint --test

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Prepare Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Seeds
        run: php artisan db:seed --force

      - name: Run Tests
        run: php artisan test --parallel

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run Composer Audit
        run: composer audit || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run NPM Audit
        run: npm audit --audit-level=high || true

  build:
    name: Build Assets
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: public/build/

  # ──────────────────────────────────────────────────────────────────────────────
  # Railway Cloud Deployment
  # ──────────────────────────────────────────────────────────────────────────────
  # Railway auto-deploys directly from the GitHub integration (no separate deploy
  # step needed here). The Railway dashboard is connected to this repository and
  # deploys when commits reach main. This job is a status gate that logs the
  # deployment trigger event for visibility.
  #
  # To configure Railway deployment:
  # 1. Go to https://railway.app → New Project → Deploy from GitHub repo
  # 2. Select MuhibChy/perfectitsecurity → Grant access
  # 3. Set required env vars in Railway dashboard (see DEPLOYMENT_GUIDE.md)
  # 4. Railway will automatically deploy on every push to main.
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-railway:
    name: Trigger Railway Deployment
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Confirm deployment trigger
        run: |
          echo "✅ All CI checks passed."
          echo "🚀 Railway auto-deployment triggered for commit: ${{ github.sha }}"
          echo "📋 Branch: ${{ github.ref_name }}"
          echo ""
          echo "Railway will pick up this push and deploy automatically."
          echo "Monitor deployment at: https://railway.app/dashboard"

  # ──────────────────────────────────────────────────────────────────────────────
  # Staging (develop branch) — placeholder for future staging environment
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging
        run: |
          echo "::notice::Staging environment not yet configured. Connect a Railway staging service to the develop branch."
