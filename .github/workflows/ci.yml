name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite
          coverage: none
      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist
      - name: Check PSR-12
        run: vendor/bin/pint --test

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite
          coverage: none
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist
      - name: Install NPM Dependencies
        run: npm ci
      - name: Build Frontend Assets
        run: npm run build
      - name: Prepare Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
      - name: Run Migrations
        run: php artisan migrate --force
      - name: Run Seeds
        run: php artisan db:seed --force
      - name: Run Tests
        run: php artisan test --parallel

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mbstring, xml, ctype, json, bcmath
          coverage: none
      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist
      - name: Run Composer Audit
        run: composer audit
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install NPM Dependencies
        run: npm ci
      - name: Run NPM Audit
        run: npm audit --audit-level=high || true

  build:
    name: Build Assets
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm ci
      - name: Build Production Assets
        run: npm run build
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: public/build/

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging
        run: |
          echo "::error::Staging deployment provider is not configured. Set STAGING_DEPLOY_CMD secret and implement the deploy step; refusing to no-op deploy."
          exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify production secrets
        run: |
          test -n "${{ secrets.PROD_DEPLOY_CMD }}" || (echo "::error::PROD_DEPLOY_CMD secret missing; refusing to deploy." && exit 1)
      - name: Deploy to Production
        run: |
          echo "::error::Production deployment command is a placeholder. Implement provider-specific deploy (SSH/rsync/Docker) using PROD_DEPLOY_CMD; refusing to no-op deploy."
          exit 1
